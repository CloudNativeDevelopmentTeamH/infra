  #   restart: unless-stopped

  auth_database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: ${DB_USERNAME?missing db username}
      POSTGRES_PASSWORD: ${DB_PASSWORD?missing db password}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - default_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth_queue:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER?missing rabbitmq user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD?missing rabbitmq password}
    ports:
      - "15672:15672"
    networks:
      - default_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth_app:
    image: ghcr.io/cloudnativedevelopmentteamh/focusboard/auth:latest
    environment:
      DB_HOST: auth_database
      DB_PORT: 5432
      DB_NAME: auth
      DB_USERNAME: ${DB_USERNAME?missing db username}
      DB_PASSWORD: ${DB_PASSWORD?missing db password}
      JWT_SECRET: ${JWT_SECRET?missing jwt secret}
      PEPPER: ${PEPPER?missing pepper}
      PORT: 4000
      GRPC_PORT: 50051
      CORS_ORIGIN: "http://localhost:3000,http://localhost:8088"
      RABBITMQ_HOST: auth_queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER?missing rabbitmq user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD?missing rabbitmq password}
    ports:
      - "4000:4000"
      - "50051:50051"
    depends_on:
      auth_database:
        condition: service_healthy
      auth_queue:
        condition: service_healthy
    networks:
      - default_network

  auth_email:
    image: ghcr.io/cloudnativedevelopmentteamh/focusboard/email:latest
    environment:
      RABBITMQ_HOST: auth_queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER?missing rabbitmq user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD?missing rabbitmq password}
      SMTP_HOST: ${SMTP_HOST?missing smtp host}
      SMTP_PORT: ${SMTP_PORT?missing smtp port}
      SMTP_USER: ${SMTP_USER?missing smtp user}
      SMTP_PASS: ${SMTP_PASS?missing smtp pass}
      SMTP_FROM: ${SMTP_FROM?missing smtp from}
    networks:
      - default_network
    depends_on:
      auth_queue:
        condition: service_healthy
    restart: unless-stopped

  focus:
    image: ghcr.io/cloudnativedevelopmentteamh/focusboard/focus:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      QUARKUS_PROFILE: docker
      QUARKUS_HTTP_PORT: 8088
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:3000,http://localhost:8088"
      QUARKUS_HTTP_CORS_METHODS: "GET,PUT,POST,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_HEADERS: "origin,content-type,accept,authorization,x-csrf-token,cookie"
      QUARKUS_HTTP_CORS_ACCESS_CONTROL_ALLOW_CREDENTIALS: "true"

      # gRPC
      QUARKUS_GRPC_CLIENTS_AUTH_HOST: auth_app
      QUARKUS_GRPC_CLIENTS_AUTH_PORT: 50051
      QUARKUS_GRPC_CLIENTS_AUTH_PLAIN_TEXT: "true"
      QUARKUS_GRPC_CLIENTS_AUTH_USE_QUARKUS_GRPC_CLIENT: "true"
      QUARKUS_GRPC_CLIENTS_ANALYTICS_HOST: analytics
      QUARKUS_GRPC_CLIENTS_ANALYTICS_PORT: 9090
      QUARKUS_GRPC_CLIENTS_ANALYTICS_PLAIN_TEXT: "true"
      QUARKUS_GRPC_CLIENTS_ANALYTICS_USE_QUARKUS_GRPC_CLIENT: "true"

      # Persistence & Flyway
      QUARKUS_HIBERNATE_ORM_ENABLED: "true"
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: validate
      QUARKUS_HIBERNATE_ORM_LOG_SQL: "true"
      QUARKUS_HIBERNATE_ORM_PACKAGES: de.thi.focus.frameworksdrivers.persistence.jpa
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_FLYWAY_LOCATIONS: db/migration
      QUARKUS_FLYWAY_BASELINE_ON_MIGRATE: "true"
      QUARKUS_FLYWAY_VALIDATE_ON_MIGRATE: "false"

      # Database
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/focus
      QUARKUS_DATASOURCE_USERNAME: focus
      QUARKUS_DATASOURCE_PASSWORD: focus

      # Business Logic & Kafka
      FOCUS_CONSTRAINTS_NOTE_MAX_LENGTH: 1000
      FOCUS_CONSTRAINTS_CATEGORY_NAME_MAX_LENGTH: 50
      FOCUS_DEFAULTS_CATEGORY_COLOR: "#FFFFFF"
      FOCUS_EVENTS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

      # Allow HTTP
      FOCUS_SECURITY_SECURE_COOKIES: "false"

    restart: unless-stopped
    networks:
      - default_network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: focus
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default_network

  analytics-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    networks:
      - default_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    entrypoint:
      - /bin/sh
      - -ec
      - |
          cat >/tmp/redpanda.yaml <<'EOF'
          config_file: /etc/redpanda/redpanda.yaml
          redpanda:
            data_directory: /var/lib/redpanda/data
            node_id: 0
            empty_seed_starts_cluster: true
            developer_mode: true
            seed_servers: []
            rpc_server:
              address: 0.0.0.0
              port: 33145
            advertised_rpc_api:
              address: redpanda
              port: 33145
            admin:
              - address: 0.0.0.0
                port: 9644
                name: admin
            kafka_api:
              - address: 0.0.0.0
                port: 9092
                name: kafka
                authentication_method: none
            advertised_kafka_api:
              - address: redpanda
                port: 9092
                name: kafka
          pandaproxy:
            pandaproxy_api:
              - address: 0.0.0.0
                port: 8082
                name: proxy
            advertised_pandaproxy_api:
              - address: redpanda
                port: 8082
                name: proxy
          EOF
          exec /opt/redpanda/bin/redpanda --redpanda-cfg /tmp/redpanda.yaml --smp=1 --memory=1G --reserve-memory=0M --overprovisioned
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      default_network:
        aliases:
          - redpanda
          - kafka

  redpanda-topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    entrypoint:
      - /bin/sh
      - -ec
      - |
          until rpk topic list --brokers redpanda:9092 >/dev/null 2>&1; do
            sleep 2
          done
          rpk topic create focus.events --brokers redpanda:9092 --partitions 3 --replicas 1 || true
    depends_on:
      - redpanda
    restart: "no"
    networks:
      - default_network

  analytics:
    image: ghcr.io/cloudnativedevelopmentteamh/focusboard/analytics:latest
    environment:
      CONFIG_PATH: config/application.yml
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: focus.events
      KAFKA_GROUP_ID: analytics-service
      STORE_BACKEND: postgres
      POSTGRES_DSN: postgres://analytics:analytics@analytics-postgres:5432/analytics?sslmode=disable
    depends_on:
      analytics-postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    restart: unless-stopped
    networks:
      - default_network

  frontend:
    image: ghcr.io/cloudnativedevelopmentteamh/focusboard/frontend:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_API_BASE_URL: "http://localhost:4000"
      API_BASE_URL: "http://localhost:8088"
      APP_VERSION: "local"
    depends_on:
      - focus
      - auth_app
    networks:
      - default_network
    restart: unless-stopped

volumes:
  auth_db_data:
  postgres_data:
  analytics_db_data:
  redpanda_data:

networks:
  default_network:
    driver: bridge
