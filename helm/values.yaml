namespace: backend

ingress:
  tls:
    # Set one of secretName or certResolver to enable TLS for websecure.
    # For local certs, set create=true and provide crt/key via --set-file.
    create: false
    createInFrontend: true
    secretName: "focusboard-local-tls"
    certResolver: ""
    crt: ""
    key: ""

# -------------------------
# Auth service configuration
# -------------------------
auth:
  name: auth-app
  port: 4000
  grpcPort: 50051
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/auth
    tag: latest
  replicas: 2
  env:
    corsOrigin: "https://frontend.localhost"
  configmap:
    name: auth-config
  secrets:
    name: auth-secrets
    values: {}

  host: auth.localhost

  postgres:
    serviceName: auth-postgres
    port: 5432
    image:
      repository: postgres
      tag: "16-alpine"
    database: "auth"
    persistence:
      claimName: postgres-pvc
      size: 1Gi
    configmap:
      name: auth-postgres-config

email:
  name: email-app
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/email
    tag: latest
  replicas: 1
  smtp:
    host: "sandbox.smtp.mailtrap.io"
    port: 2525
    from: "noreply@focusboard.app"
  configmap:
    name: email-config

# -------------------------
# Auth service RabbitMQ configuration
# -------------------------
rabbitmq:
  serviceName: rabbitmq
  port: 5672
  managementPort: 15672
  image:
    repository: rabbitmq
    tag: "4.0-management-alpine"
  persistence:
    claimName: rabbitmq-pvc
    size: 1Gi

# -------------------------
# Focus application
# -------------------------
focus:
  name: focus
  ingress:
    enabled: true

  # Container image settings
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/focus
    tag: latest

  # Deployment configuration
  port: 8088
  replicas: 2

  # Probes
  probes:
    liveness:
      # /healthz
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      # /readyz
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 5

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # HPA
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        selectPolicy: Min
        policies:
          percent:
            value: 25
            periodSeconds: 60
          pods:
            value: 1
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Max
        policies:
          percent:
            value: 50
            periodSeconds: 60

  # Service settings
  service:
    port: 80
    type: ClusterIP

  # Secrets
  secrets:
    name: focus-secrets
    values: {}

  # PostgreSQL
  postgres:
    serviceName: focus-postgres
    configmap:
      name: focus-postgres-config

    image:
      repository: postgres
      tag: "16-alpine"

    port: 5432
    database: focus
    persistence:
      enabled: true
      claimName: db-pv-claim
      # Use local-path for k3d local clusters. Override in real clusters if needed.
      storageClassName: local-path
      size: 1Gi

# -------------------------
# Focus Quarkus env
# -------------------------
quarkus:
  http:
    port: 8088
    cors:
      enabled: true
      origins: "https://frontend.localhost"
      methods: "GET,PUT,POST,DELETE,OPTIONS"
      headers: "origin,content-type,accept,authorization,x-csrf-token"
      accessControlAllowCredentials: true

  grpc:
    clients:
      auth:
        host: auth-app-service.backend.svc.cluster.local
        port: 50051
        plainText: true
        useQuarkusGrpcClient: true
      analytics:
        host: analytics-service.backend.svc.cluster.local
        port: 9090
        plainText: true
        useQuarkusGrpcClient: true

  hibernateOrm:
    enabled: true
    schemaManagement:
      strategy: validate
    log:
      sql: true
    packages: "de.thi.focus.frameworksdrivers.persistence.jpa"

  flyway:
    migrateAtStart: true
    locations: "db/migration"
    baselineOnMigrate: "true"
    validateOnMigrate: "false"

  datasource:
    dbKind: postgresql
    jdbc:
      url: "jdbc:postgresql://postgres:5432/focus"

# Application specific configuration
focusApp:
  constraints:
    note:
      maxLength: 1000
    category:
      name:
        maxLength: 50
  security:
    secureCookies: true
    csrfEnabled: false # browser ignores .localhost TLD root domain cookie https://curl.se/rfc/cookie_spec.html
  defaults:
    categoryColor: "#FFFFFF"

# -------------------------
# Frontend
# -------------------------
frontend:
  namespace: frontend
  name: frontend-app
  port: 3000
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/frontend
    tag: latest
  replicas: 1

  # Environment configuration
  env:
    apiBaseUrl: "https://focus.localhost"
    authApiBaseUrl: "https://auth.localhost"
    appVersion: "1.0.0"

  host: frontend.localhost

# -------------------------
# Analytics service
# -------------------------
analytics:
  name: analytics
  port: 8080
  grpcPort: 9090
  image:
    repository: ghcr.io/cloudnativedevelopmentteamh/focusboard/analytics
    tag: latest
  replicas: 1
  env:
    KAFKA_BROKERS: "kafka:9092"
    KAFKA_TOPIC: "focus.events"
    KAFKA_GROUP_ID: "analytics-service"
    STORE_BACKEND: "postgres"
    POSTGRES_DSN: "postgres://analytics:analytics@analytics-postgres:5432/analytics?sslmode=disable"
    CONFIG_PATH: "config/application.yml"
  configmap:
    name: analytics-config
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  secrets:
    name: analytics-secrets
    values: {}
  postgres:
    serviceName: analytics-postgres

    image:
      repository: postgres
      tag: "16-alpine"

    port: 5432
    database: analytics
    user: analytics
    persistence:
      claimName: analytics-postgres-pvc
      size: 1Gi

# -------------------------
# Redpanda (vendored chart)
# -------------------------
redpanda:
  enabled: true
  image:
    repository: docker.redpanda.com/redpandadata/redpanda
    tag: v25.1.2
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 9092
    outsidePort: 19092
    adminPort: 9644
  commandArgs: |
    --smp=1
    --memory=1G
    --reserve-memory=0M
    --node-id=0
    --check=false
    --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
    --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    --pandaproxy-addr=0.0.0.0:8082
    --advertise-pandaproxy-addr=redpanda:8082
  topicInit:
    enabled: true
    name: focus.events
    partitions: 3
    replicas: 1
