apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytics-postgres
  namespace: {{ .Values.namespace | quote }}
spec:
  serviceName: {{ .Values.analytics_postgres.serviceName | quote }}

  replicas: 1
  selector:
    matchLabels:
      app: analytics-postgres

  template:
    metadata:
      labels:
        app: analytics-postgres
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.analytics_postgres.persistence.claimName }}

      containers:
      - name: postgres
        image: "{{ .Values.analytics_postgres.image.repository }}:{{ .Values.analytics_postgres.image.tag }}"
        ports:
        - containerPort: {{ .Values.analytics_postgres.port }}
          name: postgres
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
        envFrom:
        - configMapRef:
            name: analytics-postgres-config
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          value: {{ .Values.analytics_postgres.user | quote }}