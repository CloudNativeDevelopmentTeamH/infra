apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.auth.name }}-service"
  namespace: {{ .Values.namespace | quote  }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.auth.name }}
  ports:
    - port: {{ .Values.auth.port }}
      targetPort: {{ .Values.auth.port }}
      name: http
    - port: {{ .Values.auth.grpcPort }}
      targetPort: {{ .Values.auth.grpcPort }}
      name: grpc

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.auth_postgres.serviceName | replace "_" "-" | lower }}"
  namespace: {{ .Values.namespace | quote }}
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: postgres
  ports:
    - port: {{ .Values.auth_postgres.port }}
      targetPort: {{ .Values.auth_postgres.port }}
      name: postgres
