apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: {{ .Values.namespace | quote  }}
spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ .Values.auth.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.auth.name }}
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - >
              echo "Waiting for PostgreSQL...";
              until nc -z -w 2 {{ .Values.auth.postgres.serviceName }}.{{ .Values.namespace }}.svc.cluster.local {{ .Values.auth.postgres.port }}; do
                sleep 2;
              done;
              echo "Waiting for RabbitMQ...";
              until nc -z -w 2 {{ .Values.rabbitmq.serviceName }}.{{ .Values.namespace }}.svc.cluster.local {{ .Values.rabbitmq.port }}; do
                sleep 2;
              done;
              echo "Dependencies are ready!";

      imagePullSecrets:
        - name: {{ .Values.pullSecret.name }}

      containers:
       - name: {{ .Values.auth.name }}
         image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
         ports:
          - containerPort: {{ .Values.auth.port }}
            name: http
            protocol: TCP
         envFrom:
         - configMapRef:
             name: {{ .Values.auth.configmap.name }}
         - secretRef:
             name: {{ .Values.auth.secrets.name }}

