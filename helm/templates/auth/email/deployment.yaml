apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.email.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.email.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.email.name }}
    spec:
      initContainers:
      - name: email-wait-for-dependencies
        image: busybox:1.36
        command: ['sh', '-c']
        args:
          - >
            echo "Waiting for RabbitMQ...";
            until nc -z -w 2 {{ .Values.rabbitmq.serviceName }}.{{ .Values.namespace }}.svc.cluster.local {{ .Values.rabbitmq.port }}; do
              sleep 2;
            done;
            echo "Dependencies are ready!";

      imagePullSecrets:
        - name: {{ .Values.pullSecret.name }}

      containers:
        - name: {{ .Values.email.name }}
          image: "{{ .Values.email.image.repository }}:{{ .Values.email.image.tag }}"
          envFrom:
            - configMapRef:
                name: {{ .Values.email.configmap.name }}
            - secretRef:
                name: {{ .Values.auth.secrets.name }}
