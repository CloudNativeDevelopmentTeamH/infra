apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-ingress
  namespace: {{ .Values.frontend.namespace | quote  }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.frontend.host }}`)
      services:
        - name: "{{ .Values.frontend.name }}-service"
          port: {{ .Values.frontend.port }}
  {{ if or .Values.ingress.tls.secretName .Values.ingress.tls.certResolver }}
  tls:
    {{ if .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName | quote }}
    {{ end }}
    {{ if .Values.ingress.tls.certResolver }}
    certResolver: {{ .Values.ingress.tls.certResolver | quote }}
    {{ end }}
  {{ end }}
