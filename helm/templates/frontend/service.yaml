apiVersion: v1
kind: Service
metadata:
  name: "{{ .Values.frontend.name }}-service"
  namespace: {{ .Values.frontend.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.frontend.name }}
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      name: http
