{{- if .Values.focus_secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.focus_secrets.name | replace "_" "-" | lower }}
  namespace: {{ .Values.namespace | quote }}
type: Opaque
stringData:
  {{- with .Values.focus_secrets.values }}
  DB_USERNAME: {{ .DB_USERNAME | quote }}
  DB_PASSWORD: {{ .DB_PASSWORD | quote }}
  QUARKUS_DATASOURCE_USERNAME: {{ .QUARKUS_DATASOURCE_USERNAME | quote }}
  QUARKUS_DATASOURCE_PASSWORD: {{ .QUARKUS_DATASOURCE_PASSWORD | quote }}
  {{- end }}
{{- end }}
