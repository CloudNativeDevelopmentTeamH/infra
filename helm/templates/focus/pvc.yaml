apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.persistence.claimName }}
  namespace: focus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.persistence.storageClassName | default "ebs-sc" }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | default "1Gi" }}