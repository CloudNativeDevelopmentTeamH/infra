apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  serviceName: redpanda-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: redpanda
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        args:
{{- range $arg := splitList "\n" .Values.commandArgs }}
{{- if ne (trim $arg) "" }}
          - {{ $arg | quote }}
{{- end }}
{{- end }}
        ports:
        - name: kafka
          containerPort: {{ .Values.service.port }}
        - name: outside
          containerPort: {{ .Values.service.outsidePort }}
        - name: admin
          containerPort: {{ .Values.service.adminPort }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
